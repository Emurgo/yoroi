version: 2

coverage:
  status:
    project:
      default:
        threshold: 1%
        target: 100%
        if_not_found: success

components:
  "@yoroi/api":
    paths:
      - "packages/api"

  "@yoroi/blockchains":
    paths:
      - "packages/blockchains"

  "@yoroi/claim":
    paths:
      - "packages/claim"

  "@yoroi/common":
    paths:
      - "packages/common"

  "@yoroi/dapp-connector":
    paths:
      - "packages/dapp-connector"

  "@yoroi/exchange":
    paths:
      - "packages/exchange"

  "@yoroi/explorers":
    paths:
      - "packages/explorers"

  "@yoroi/identicon":
    paths:
      - "packages/identicon"

  "@yoroi/links":
    paths:
      - "packages/links"

  "@yoroi/notifications":
    paths:
      - "packages/notifications"

  "@yoroi/portfolio":
    paths:
      - "packages/portfolio"

  "@yoroi/resolver":
    paths:
      - "packages/resolver"

  "@yoroi/setup-wallet":
    paths:
      - "packages/setup-wallet"

  "@yoroi/staking":
    paths:
      - "packages/staking"

  "@yoroi/swap":
    paths:
      - "packages/swap"

  "@yoroi/theme":
    paths:
      - "packages/theme"

  "@yoroi/transfer":
    paths:
      - "packages/transfer"

  "@yoroi/types":
    paths:
      - "packages/types"

  "@yoroi/wallet-mobile":
    paths:
      - "apps/wallet-mobile"

parsers:
  javascript:
    enable_gcov: no

ignore:
  - "node_modules"
  - "dist"
  - "build"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "scripts"
  - "coverage"

comment:
  layout: "reach,diff,components"
  require_changes: true
  behavior: default
