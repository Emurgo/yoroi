name: Create production build for Google Play and Testflight with EAS
on:
  pull_request:
    types: [closed]
    branches:
      - production

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  production-build:
    if: github.event.pull_request.merged == true
    runs-on: macos-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🔍 Check if mobile-checks passed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-checks.yml',
              head_sha: context.payload.pull_request.head.sha,
              per_page: 1
            });
            
            if (runs.workflow_runs.length === 0) {
              throw new Error('No mobile-checks workflow run found for this PR');
            }
            
            const run = runs.workflow_runs[0];
            if (run.conclusion !== 'success') {
              throw new Error(`mobile-checks workflow failed with conclusion: ${run.conclusion}`);
            }
            
            console.log('✅ mobile-checks workflow passed successfully');

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 📦 Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: mobile
        run: npm ci

      - name: 🚀 Create production build
        run: eas build --profile production --platform all --non-interactive

      - name: 🚀 Submit build to Apple TestFlight
        run: eas submit --platform ios --profile production --non-interactive --latest

      - name: 🚀 Submit build to Android Google Play
        run: eas submit --platform android --profile production --non-interactive --latest
