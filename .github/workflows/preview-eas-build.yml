name: Create preview build for devices with EAS
on:
  pull_request:
    types: [closed]
    branches:
      - preview
      - preview-next
      

env:
  GITHUB_TOKEN: ${{ secrets.PKG_TOKEN }}

jobs:
  preview-build:
    runs-on: macos-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 📦 Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PKG_TOKEN }}
        working-directory: mobile
        run: npm ci

      - name: 🚀 Create preview build
        working-directory: mobile
        run: eas build --profile preview --platform all --no-wait --non-interactive
